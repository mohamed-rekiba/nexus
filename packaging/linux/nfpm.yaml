# The deb, rpm and Arch packages, with nfpm (https://nfpm.goreleaser.com), from the Linux folder
# scripts/package.sh made. Nothing is compiled again. build-packages.sh runs it once per format
# with these set:
#   FOLDER    the release folder, dist/nexus-linux-x86_64
#   VERSION   the version, without a leading v
#   PACKAGED  a file holding the format (deb, rpm or arch): /usr/lib/nexus/packaged, which tells
#             Nexus it was installed this way and updates through the package manager
name: nexus
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: games
priority: optional
maintainer: Nexus <https://github.com/mohamed-rekiba/nexus>
homepage: https://github.com/mohamed-rekiba/nexus
license: GPL-2.0-or-later
description: |
  A game launcher for PS5, PS4 and PC games, made for a TV and a controller.
  It plays PS5 games with KytyPS5, PS4 games with shadPS4, and PC games natively or through
  Wine or Proton. With gamescope it is also a session of its own, without a desktop: choose
  "Nexus" at the login screen.

contents:
  # The release folder as it is: Nexus finds its libraries and extensions beside the binary.
  - src: ${FOLDER}/nexus
    dst: /usr/lib/nexus/nexus
    expand: true
    file_info:
      mode: 0755
  - src: ${FOLDER}/lib
    dst: /usr/lib/nexus/lib
    type: tree
    expand: true
  - src: ${FOLDER}/licenses
    dst: /usr/lib/nexus/licenses
    type: tree
    expand: true
  - src: ${FOLDER}/LICENSE
    dst: /usr/lib/nexus/LICENSE
    expand: true
  - dst: /usr/lib/nexus/extensions
    type: dir
  - src: ${PACKAGED}
    dst: /usr/lib/nexus/packaged
    expand: true
  - src: /usr/lib/nexus/nexus
    dst: /usr/bin/nexus
    type: symlink
  - src: packaging/linux/nexus-session
    dst: /usr/bin/nexus-session
    file_info:
      mode: 0755
  - src: packaging/linux/session.conf
    dst: /usr/share/nexus/session.conf
  - src: packaging/linux/nexus.desktop
    dst: /usr/share/applications/nexus.desktop
  - src: packaging/linux/nexus-session.desktop
    dst: /usr/share/wayland-sessions/nexus.desktop
  - src: assets/nexus.png
    dst: /usr/share/icons/hicolor/512x512/apps/nexus.png
  - src: ${FOLDER}/README.md
    dst: /usr/share/doc/nexus/README.md
    expand: true

# What Nexus links and loads at run time (sound, fonts, controllers, the window, Vulkan for This
# PC), the tools it runs to bring games to the front (ps, xdotool, xprop), what old Linux games'
# own launchers need (GTK 2, and libpng 1.2 where the system has it: Trine 3's GOG start.sh runs
# Frozenbyte's launcher), and, recommended, the session's display servers, the tools of
# Settings → System (NetworkManager, BlueZ, pactl), and unar, for the RAR archives libarchive
# can't read (a RAR 5 with a big dictionary, as in Cuphead's installer). Debian, Ubuntu and Arch have no libpng 1.2
# package (Arch's is in the AUR). Only the rpm depends on the 32-bit libraries that a game's own
# 32-bit Wine needs: Debian and Ubuntu need the i386 architecture added first, Arch the multilib
# repository.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libasound2 | libasound2t64
      - libfontconfig1
      - libudev1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libegl1
      - procps
      - xdotool
      - x11-utils
      - libgtk2.0-0t64 | libgtk2.0-0
    recommends:
      - gamescope
      - cage
      - libvulkan1
      - network-manager
      - bluez
      - pulseaudio-utils
      - unar
  rpm:
    depends:
      - glibc >= 2.35
      - alsa-lib
      - fontconfig
      - systemd-libs
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd-egl
      - procps-ng
      - xdotool
      - xprop
      - gtk2
      - libpng12
      # 32-bit libraries, for a game that brings its own 32-bit Wine (a portable Wine wrapper):
      # the C library, X11 for its window, OpenGL and Vulkan, sound and fonts.
      - glibc(x86-32)
      - libgcc(x86-32)
      - libX11(x86-32)
      - libXext(x86-32)
      - libXcomposite(x86-32)
      - libXcursor(x86-32)
      - libXfixes(x86-32)
      - libXinerama(x86-32)
      - libXi(x86-32)
      - libXrandr(x86-32)
      - libXrender(x86-32)
      - libXxf86vm(x86-32)
      - mesa-libGL(x86-32)
      - mesa-dri-drivers(x86-32)
      - mesa-vulkan-drivers(x86-32)
      - vulkan-loader(x86-32)
      - alsa-lib(x86-32)
      - pulseaudio-libs(x86-32)
      - freetype(x86-32)
      - fontconfig(x86-32)
    recommends:
      - gamescope
      - cage
      - vulkan-loader
      - NetworkManager
      - bluez
      - pulseaudio-utils
      - unar
  archlinux:
    depends:
      - glibc
      - alsa-lib
      - fontconfig
      - systemd-libs
      - libxkbcommon
      - libxkbcommon-x11
      - libglvnd
      - procps-ng
      - xdotool
      - xorg-xprop
      - gtk2
    # Arch's optional dependencies.
    suggests:
      - gamescope
      - cage
      - vulkan-icd-loader
      - networkmanager
      - bluez-utils
      - libpulse
      - unarchiver
