# The Nexus session's settings (/usr/bin/nexus-session). This file is the package's defaults:
# copy a line to /etc/nexus/session.conf to change it there, where package upgrades leave it.
# It is read by the shell, so each line is NAME=value.

# The launcher to run.
NEXUS_BIN=/usr/bin/nexus
# gamescope's options. -e is its Steam mode: Nexus switches between itself and a game with
# gamescope's focus atoms. The command line follows these and `--`.
NEXUS_GAMESCOPE_ARGS="-e --xwayland-count 1"
# Seconds to wait for Nexus's "window shown" line before starting it again.
NEXUS_WATCHDOG=90
# Seconds to wait for the network at the start, so the first downloads don't fail.
NEXUS_WAIT_NETWORK=5
# Where the session and Nexus write their output.
NEXUS_LOG="${XDG_CACHE_HOME:-$HOME/.cache}/nexus-session.log"
# Megabytes the log may reach before the session starts a new one: the one before is kept as
# nexus-session.previous.log.
NEXUS_LOG_MAX_MB=10
