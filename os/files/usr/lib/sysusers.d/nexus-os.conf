# The console's user: logged in automatically, no password (there's no login screen). The
# logged-in user already gets the graphics card, sound and controllers (systemd-logind).
u player 1000 "Player" /var/home/player /usr/bin/bash
# In GameMode's group: GameMode tunes the computer for a game (its priority, the processor's
# speed) without a password.
m player gamemode
