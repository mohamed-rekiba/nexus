# Fedora's installer (Anaconda) on the Nexus OS USB stick: only the screens a player needs
# (language, keyboard, time zone, and the disk screen, which decides the partitions). The image
# already has its user, "player", with no password, so the user and root password screens are
# hidden; the network is the live system's.
[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[User Interface]
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
    UserSpoke

hidden_webui_pages =
    root-password
    account
    network

[Localization]
use_geolocation = False
