# On the USB stick: the system the installers copy is stored read-only in the stick's root
# filesystem (os/build-iso.sh puts it in /var/lib/containers/storage there), which the live system
# sees at /run/rootfsbase. Anything podman adds (NVIDIA's driver while installing) is kept in
# memory, since the stick's root filesystem, itself an overlay, can't hold container layers.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/run/rootfsbase/var/lib/containers/storage"]
