# cargo-about: the licences of every Rust crate in the build, for the package's
# THIRD-PARTY.md (scripts/package.sh). The same list as deny.toml's [licenses] allow.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["ring", "rustls"]
