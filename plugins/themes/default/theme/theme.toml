id = "default"
kind = "theme"
name = "Default"
version = "0.1.0"
host_api = "^0.2"
capabilities = ["theme"]
activation = "eager"

# The Default theme, the one the app starts with. Home is a list of the systems the emulators
# play, on the far side, with the focused system's cover behind it; each opens the Library on
# its games. Every other screen, the tokens, the fonts and the sounds are the Classic theme's. The systems' icons and covers come from their
# emulator plugins: `[theme.systems.<SYSTEM>]` would put this theme's own in their place.
[theme]
ui_api = "^0.2.0"
extends = "classic"
screens = ["home"]
input = ["gamepad", "pointer"]
navigation = "focus"

# The "All games" entry at the top of the list (scripts/make-system-art.sh).
[theme.assets.images]
all-games-icon = "images/all-games-icon.png"
all-games-cover = "images/all-games-cover.jpg"
