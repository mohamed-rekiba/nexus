id = "emu-steam"
kind = "emulator"
name = "Steam"
version = "0.1.0"
host_api = "^0.1"
# Nexus finds a game Steam started by its command line, which only Linux's process list has.
platforms = ["linux"]
# Steam's console: its Catalog list is the player's Steam library (releases), which Steam installs.
console = "Steam"
capabilities = ["catalog", "launcher", "slots", "releases", "metadata"]

[permissions]
# Steam starts the game: its own command, or the Flatpak's.
process = ["system:steam", "system:flatpak"]
# Steam's art for a game its cache doesn't have, and Steam's store's details of a game (its
# words, screenshots, trailer), which need no key.
network = ["*.steamstatic.com", "store.steampowered.com"]
# Install and Uninstall of a Steam game ask Steam to, in its own dialogs; Downloads' "Open in
# Steam" opens Steam's own Downloads page.
links = ["steam://install/", "steam://uninstall/", "steam://open/downloads"]

# Steam's folders: where Steam is, and its libraries on other drives. Read only. Until you map
# it, each of these folders that exists is read, and each library Steam lists in it (Steam's own
# list, wherever the libraries are).
[[permissions.filesystem]]
folder = "steam"
title = "Steam libraries"
help = "Found by itself: Steam's folder and the libraries Steam lists. Set folders here only to read others. Separate folders with ;"
default = ["~/.local/share/Steam", "~/.var/app/com.valvesoftware.Steam/.local/share/Steam", "~/.steam/steam"]
listed_in = { file = "steamapps/libraryfolders.vdf", key = "path", holds = "steamapps" }

# The system its games show under: what the Library and a card call it, and its color.
[system]
id = "Steam"
name = "Steam"
color = "#66c0f4"
