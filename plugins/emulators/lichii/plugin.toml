id = "emu-lichii"
kind = "emulator"
# The plugin is shown by the console it plays.
name = "Switch"
# The program the plugin installs and runs. Sentences about the program name it.
emulator = "Lichii"
version = "0.1.0"
host_api = "^0.2"
# The official build this plugin installs: the Linux AppImage. Lichii's Windows and macOS
# builds are not wired yet.
platforms = ["linux"]
# The console it plays: it gets that console's catalog (switch.json).
console = "Switch"
capabilities = ["catalog", "downloader", "installer", "configurator", "launcher", "slots", "game_installer"]
# What the install sheet says this emulator installs from.
install_note = "Installs a Switch game from its game files (.nsp, .nsz, .xci, .xcz, .nup), with its update and DLC files, into the Switch folder of your game folders. Lichii needs your own keys and firmware in ~/.local/share/eden; Nexus doesn't provide them."

[permissions]
# GitHub's API, release downloads and the CDN they redirect to.
network = ["api.github.com", "github.com", "*.githubusercontent.com"]
# The AppImage is unpacked once, so running it needs no FUSE.
# The host runs the downloaded AppImage once, to unpack it.
# Your own build: in the folder you map as lichii-build, or on your PATH.
process = [
    "builds/*/squashfs-root/AppRun",
    "builds/*/*.AppImage",
    "folder:lichii-build",
    "system:lichii",
]

# The player's game folders, shared with other emulators (the host's default is ~/Games).
# Switch game files are found anywhere in them; installs go to Switch/ in the first one.
[[permissions.filesystem]]
folder = "games"
write = true

# Switch game files to install, in its Switch folder, and downloads of Switch releases. Read only.
[[permissions.filesystem]]
folder = "packages"

# A Lichii you built or installed yourself. Read only.
[[permissions.filesystem]]
folder = "lichii-build"
title = "Your own Lichii build"
after = "own_build"

# The system its games show under: what the Library and a card call it, and its color.
# Its id is the catalog's console, upper case.
[system]
id = "SWITCH"
name = "Nintendo Switch"
color = "#e60012"
