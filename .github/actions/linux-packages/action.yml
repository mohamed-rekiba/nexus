name: Linux packages
description: >-
  The deb, rpm and Arch packages (nfpm, packaging/linux) from the Linux folder scripts/package.sh
  made, then their checks: each file, the programs' modes, the packaging marker, the
  dependencies.
inputs:
  folder:
    description: The release folder (dist/nexus-linux-x86_64)
    default: dist/nexus-linux-x86_64
  version:
    description: Package version, without a leading v (for example 0.2.0)
    required: true
  output:
    description: Folder the packages are written to
    default: dist
runs:
  using: composite
  steps:
    - name: nfpm
      shell: bash
      env:
        # Pinned with its SHA-256 as GitHub lists it. Dependabot doesn't follow this: change both.
        NFPM_VERSION: 2.47.0
        NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
      run: |
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/nfpm.tar.gz" \
          "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
        echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
    - name: Build the packages
      shell: bash
      env:
        NFPM: ${{ runner.temp }}/nfpm
        FOLDER: ${{ inputs.folder }}
        VERSION: ${{ inputs.version }}
        OUTPUT: ${{ inputs.output }}
      run: packaging/linux/build-packages.sh "$FOLDER" "$VERSION" "$OUTPUT/packages"
    - name: Check the packages
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        sudo apt-get install -y --no-install-recommends rpm zstd > /dev/null
        packaging/linux/check-packages.sh "$OUTPUT/packages"
        mv "$OUTPUT"/packages/* "$OUTPUT/"
        rmdir "$OUTPUT/packages"
