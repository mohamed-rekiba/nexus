name: Setup
description: >-
  The Rust toolchain, the system packages the build needs on Linux, and the dependency cache.
  Every job that builds Nexus runs this.
inputs:
  linux-packages:
    description: Extra apt packages on Linux, space-separated
    default: ""
  cache-key:
    description: Keeps the caches of jobs that build different things apart
    default: ""
  save-cache:
    description: >-
      'true' saves the cache at the end of the job. Callers pass true on main only: pull
      requests then restore main's cache and never write their own.
    default: "false"
runs:
  using: composite
  steps:
    # rust-toolchain.toml picks the channel and the components.
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        components: clippy, rustfmt
    # Slint needs fontconfig and xkbcommon; gilrs needs udev (controllers); rodio needs ALSA.
    - name: Linux system packages
      if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA: ${{ inputs.linux-packages }}
      run: >-
        sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends
        libfontconfig1-dev libxkbcommon-dev libudev-dev libasound2-dev $EXTRA
    # Caches ~/.cargo and target/ (dependencies only). The key holds the job, the toolchain and
    # Cargo.lock; it also sets CARGO_INCREMENTAL=0, which CI builds don't benefit from.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}
