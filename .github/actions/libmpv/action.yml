name: libmpv
description: >-
  libmpv, which the package ships for the trailer player, and the tools that bundle it:
  Homebrew's mpv and dylibbundler on macOS, apt's libmpv and patchelf and a pinned linuxdeploy
  on Linux, and a pinned shinchiro build on Windows (each checked against its SHA-256). Sets
  LINUXDEPLOY on Linux and LIBMPV_DIR on Windows.
runs:
  using: composite
  steps:
    - name: macOS
      if: runner.os == 'macOS'
      shell: bash
      run: brew install mpv dylibbundler
    - name: Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        # linuxdeploy, for the AppImage: a tagged release and its SHA-256 as GitHub lists it.
        LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
        LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        # scripts/download.sh logs in to GitHub with it.
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo apt-get install -y --no-install-recommends libmpv-dev mpv patchelf file
        tool="$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
        scripts/download.sh "$LINUXDEPLOY_URL" "$tool"
        echo "$LINUXDEPLOY_SHA256  $tool" | sha256sum -c -
        chmod +x "$tool"
        echo "LINUXDEPLOY=$tool" >> "$GITHUB_ENV"
    - name: Windows
      if: runner.os == 'Windows'
      shell: bash
      env:
        # Change all four together (and run the mirror-deps workflow again): the build's
        # file, where shinchiro published it, its SHA-256 as GitHub lists it, and the FFmpeg
        # commit it was built from. shinchiro keeps about six weeks of builds, so this repo's
        # `deps` release holds a copy. The FFmpeg commit is in libmpv-2.dll:
        # `strings libmpv-2.dll | grep -o 'N-[0-9]*-g[0-9a-f]*'` prints N-<count>-g<commit>.
        FILE: mpv-dev-x86_64-20261018-git-01e2533f31.7z
        UPSTREAM: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261018
        SHA256: d7f5621f42b6e161fe032df914a10bdece28a89df3e57c6c3e16a5a250929b5e
        FFMPEG_COMMIT: 94cba3150c6b83057ed48b833689adc806715cc0
        GH_TOKEN: ${{ github.token }}
      run: |
        archive="$RUNNER_TEMP/$FILE"
        if ! gh release download deps -R "$GITHUB_REPOSITORY" --pattern "$FILE" --dir "$RUNNER_TEMP" 2> /dev/null; then
          echo "no copy in this repo's deps release; from shinchiro"
          scripts/download.sh "$UPSTREAM/$FILE" "$archive"
        fi
        echo "$SHA256  $archive" | sha256sum -c -
        7z x -y -o"$RUNNER_TEMP/libmpv" "$archive" > /dev/null
        echo "LIBMPV_DIR=$RUNNER_TEMP/libmpv" >> "$GITHUB_ENV"
        echo "LIBMPV_SOURCE=$UPSTREAM/$FILE" >> "$GITHUB_ENV"
        echo "LIBMPV_FFMPEG=$FFMPEG_COMMIT" >> "$GITHUB_ENV"
