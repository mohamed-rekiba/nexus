name: Sources list
description: >-
  Uploads the SOURCES lists of the package scripts/package.sh made (each bundled library's
  licenses/<library>/SOURCES) as the artifact sources-list-<package>. package.yml's sources job
  fetches what they name into <package>-third-party-sources.tar.
inputs:
  package:
    description: >-
      The name the sources tar takes (nexus-linux-x86_64); the lists come from the one package
      folder in dist/
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        out="$RUNNER_TEMP/sources-list/$PACKAGE"
        found=0
        while IFS= read -r -d '' list; do
          library="$(basename "$(dirname "$list")")"
          mkdir -p "$out/licenses/$library"
          cp "$list" "$out/licenses/$library/SOURCES"
          found=1
        done < <(find dist/nexus-*/ -path '*licenses/*/SOURCES' -print0)
        if [ "$found" = 0 ]; then
          echo "::error::no SOURCES in dist/nexus-*/"
          exit 1
        fi
        find "$out" -type f
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sources-list-${{ inputs.package }}
        path: ${{ runner.temp }}/sources-list
        if-no-files-found: error
        retention-days: 7
