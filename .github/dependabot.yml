version: 2
# One pull request per ecosystem, once a month: each pull request (and each rebase of it) runs
# CI, so fewer of them saves Actions minutes. Security updates don't wait for this schedule:
# Dependabot opens them as soon as an advisory is out.
updates:
  # Actions are pinned to commit SHAs; Dependabot keeps the pins (and their version comments)
  # current, in the workflows and in the local actions.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions: { patterns: ["*"] }
  # Slint is pinned to an exact version (`=`) in Cargo.toml: it moves only by hand, with its
  # changelog read, since themes depend on its language.
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, rust]
    ignore:
      - dependency-name: "slint*"
      - dependency-name: "i-slint-*"
    groups:
      # Everything in one pull request, majors too. RustCrypto's crates must move together
      # anyway (they share cipher, digest and crypto-common). When a major breaks the build,
      # fix it in that pull request.
      cargo: { patterns: ["*"] }
