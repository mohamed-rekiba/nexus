name: Package

# Builds Nexus's packages on each system:
#   Linux    the tar.gz, the AppImage, and the deb, rpm and Arch packages
#   macOS    one universal Nexus.app (Apple Silicon and Intel), as a .zip and a .dmg, signed with
#            the Developer ID and notarized when the secrets are set (docs/signing.md)
#   Windows  the zip and the installer, signed when the certificate is set
#
# On a Nexus tag (v<version>) it attaches the files to the tag's draft release, with a SHA-256
# file and signed build provenance for each and latest.json for the launcher's updater, and
# publishes the release as the latest. Then it names the release in os/nexus.txt on main, so
# Release Please opens the Nexus OS release pull request, and starts os.yml: the Nexus OS
# release made in the same push, if any (os-release), or else new images with this Nexus for
# the PCs already installed. release.yml starts it on
# the tag Release Please made; to build a release again, run it by hand on the tag ("Use
# workflow from"). On a branch it only builds, and the files stay as the run's artifacts: run
# it so to try a packaging change.
#
# It doesn't run the tests: CI did on the commit before it reached main.
#
# The jobs:
#   version ─┬─ build (Linux, Windows) ──────────────────────────┬─ publish ─ os
#            ├─ build-mac (Apple Silicon, Intel) ─ macos ────────┤
#            └─ (both builds) ─ sources ─────────────────────────┘
# Each build restores the cache warm-cache.yml keeps on main, and lists the third-party
# sources its package ships; the sources job fetches them while the Mac app is signed.
on:
  workflow_dispatch:
    inputs:
      os-release:
        description: A Nexus OS tag released in the same push, to build once this release is out
        type: string
        default: ""

permissions: {}

# Two runs for the same release never upload to it at once.
concurrency:
  group: package-${{ github.ref_type == 'tag' && github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Homebrew updates itself before each install unless told not to: minutes per macOS job.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  # scripts/download.sh logs in to GitHub with it: GitHub can time out logged-out downloads
  # when it is busy. Each job's token has only that job's permissions.
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG, but Cargo.toml says version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One system failing doesn't cancel the others: "Re-run failed jobs" then builds only it.
      fail-fast: false
      matrix:
        include:
          # 22.04: the Linux build runs on systems with glibc as old as its own.
          - { name: linux, runner: ubuntu-22.04, package: nexus-linux-x86_64 }
          - { name: windows, runner: windows-2022, package: nexus-windows-x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # warm-cache.yml saves this cache on main; a release only restores it.
      - uses: ./.github/actions/setup
        with:
          shared-key: package-${{ matrix.name }}
      # libmpv for the trailer player and libarchive for RAR and other archives, which the
      # package ships with their licences.
      - uses: ./.github/actions/libmpv
        timeout-minutes: 15
      - uses: ./.github/actions/libarchive
        timeout-minutes: 15
      # The crates' licences for the package (about.toml), prebuilt, or from the cache.
      - uses: ./.github/actions/cargo-tool
        timeout-minutes: 10
        with:
          tool: cargo-about
          version: 0.9.2
      # Builds, runs `nexus --help` from the package, and packs it on Linux.
      - run: scripts/package.sh

      - name: AppImage, deb, rpm and Arch packages (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Nexus-x86_64.AppImage --version
      - if: runner.os == 'Linux'
        timeout-minutes: 15
        uses: ./.github/actions/linux-packages
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Sign nexus.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.ps1 dist\nexus-windows-*\*.exe dist\nexus-windows-*\*.dll
      - name: Zip and installer (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && 7z a -tzip nexus-windows-x86_64.zip nexus-windows-x86_64 > /dev/null)
          scripts/windows-installer.sh "$VERSION"
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.ps1 dist\nexus-windows-x86_64-setup.exe
      # The installer installs silently, Nexus starts from where it put it, and the uninstaller
      # takes it all away again.
      - name: Try the installer (Windows)
        if: runner.os == 'Windows'
        run: |
          dist/nexus-windows-x86_64-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //TASKS=""
          # The installer's [Run] entry starts Nexus after a silent install: end it.
          sleep 5; taskkill //IM nexus.exe //F 2> /dev/null || true
          app="$LOCALAPPDATA/Programs/Nexus"
          test -f "$app/installed-by-setup"
          "$app/nexus.exe" --help > /dev/null
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for _ in $(seq 30); do [ ! -e "$app/nexus.exe" ] && break; sleep 1; done
          test ! -e "$app/nexus.exe"

      - uses: ./.github/actions/sources-list
        with:
          package: ${{ matrix.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # The Mac builds have their own job, so the universal app waits only for them.
  build-mac:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Mac processor on a runner of its own kind; the macos job joins them. The
          # universal app's licences are the Apple Silicon build's, so its SOURCES are too.
          - { name: macos-arm64, runner: macos-15, sources: nexus-macos-universal }
          - { name: macos-x86_64, runner: macos-15-intel, sources: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # warm-cache.yml saves this cache on main; a release only restores it.
      - uses: ./.github/actions/setup
        with:
          shared-key: package-${{ matrix.name }}
      - uses: ./.github/actions/libmpv
        timeout-minutes: 15
      - uses: ./.github/actions/libarchive
        timeout-minutes: 15
      - if: matrix.name != 'macos-x86_64'
        uses: ./.github/actions/cargo-tool
        timeout-minutes: 10
        with:
          tool: cargo-about
          version: 0.9.2
      # cargo-about has no Intel Mac build: compile it, unless the cache has it. Its program
      # needs the `cli` feature, which install-action's fallback leaves out.
      - name: cargo-about (Intel Mac)
        if: matrix.name == 'macos-x86_64'
        run: |
          cargo about --version 2> /dev/null | grep -qw 0.9.2 \
            || cargo install cargo-about@0.9.2 --locked --features cli
      # Builds, runs `nexus --help` from the app, and zips it.
      - run: scripts/package.sh
      - if: matrix.sources != ''
        uses: ./.github/actions/sources-list
        with:
          package: ${{ matrix.sources }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # mac-, not build-: publish uploads every build-* artifact, and these zips are only
          # the universal app's input.
          name: mac-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal app
    needs: build-mac
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mac-*
          path: built
          merge-multiple: true
      - name: Join the two apps
        run: |
          for arch in aarch64 x86_64; do
            ditto -x -k "built/nexus-macos-$arch.zip" "built/$arch"
          done
          mkdir -p dist/nexus-macos-universal
          packaging/macos/universal.sh built/aarch64/nexus-macos-aarch64/Nexus.app \
            built/x86_64/nexus-macos-x86_64/Nexus.app dist/nexus-macos-universal/Nexus.app
          cp built/aarch64/nexus-macos-aarch64/{README.md,LICENSE} dist/nexus-macos-universal/
          dist/nexus-macos-universal/Nexus.app/Contents/MacOS/nexus --help > /dev/null
      # A Developer ID signature and Apple's notarization, when the secrets are set:
      # MACOS_CERT_P12 (the certificate, base64), MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID
      # and APPLE_APP_PASSWORD (an app-specific password). Without them the app stays signed
      # ad hoc, and Gatekeeper asks before the first start.
      - name: Sign and notarize the app
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          name=nexus-macos-universal
          app="dist/$name/Nexus.app"
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::no MACOS_CERT_P12: the macOS app is signed ad hoc only"
          else
            keychain="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings "$keychain"
            security unlock-keychain -p "" "$keychain"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain"
            # Libraries first, then the bundle: the hardened runtime and a timestamp, as
            # notarization asks.
            find "$app/Contents/Frameworks" -name '*.dylib' -exec codesign --force --timestamp --options runtime --sign "Developer ID Application" {} +
            codesign --force --timestamp --options runtime --sign "Developer ID Application" "$app"
            (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
            xcrun notarytool submit "dist/$name.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$app"
          fi
          (cd dist && rm -f "$name.zip" && ditto -c -k --keepParent "$name" "$name.zip")
      - name: Disk image
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg=dist/nexus-macos-universal.dmg
          packaging/macos/make-dmg.sh dist/nexus-macos-universal/Nexus.app "$dmg"
          if [ -n "$MACOS_CERT_P12" ]; then
            codesign --force --timestamp --sign "Developer ID Application" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
          hdiutil verify "$dmg"
          mounted=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/Volumes/ {print $NF}')
          test -x "$mounted/Nexus.app/Contents/MacOS/nexus"
          test -L "$mounted/Applications"
          hdiutil detach "$mounted"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos-universal
          path: |
            dist/nexus-macos-universal.zip
            dist/nexus-macos-universal.dmg
          if-no-files-found: error
          retention-days: 7

  # The source of the GPL code the packages ship (mpv, FFmpeg, and on Windows MSYS2's
  # libraries), one tar per package, to publish beside them. Each build lists what its package
  # ships (the sources-list action); this job fetches it, beside the Mac app's signing. The
  # archives are cached by the lists, so a release downloads only what changed.
  sources:
    name: Third-party sources
    needs: [build, build-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEXUS_SOURCES_CACHE: ${{ github.workspace }}/sources-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sources-list-*
          path: lists
          merge-multiple: true
      - id: key
        run: echo "hash=$(find lists -name SOURCES -print0 | sort -z | xargs -0 cat | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sources-cache
          key: third-party-sources-${{ steps.key.outputs.hash }}
          restore-keys: third-party-sources-
      - name: Fetch
        timeout-minutes: 20
        run: |
          mkdir -p "$NEXUS_SOURCES_CACHE"
          for dir in lists/*/; do
            scripts/fetch-sources.sh "${dir%/}"
          done
          # Only what these lists name stays in the cache.
          keep="$(find lists -name SOURCES -print0 | xargs -0 cat | awk 'NF { n = split($2, p, "/"); print $1 "-" p[n] }')"
          for file in "$NEXUS_SOURCES_CACHE"/*; do
            [ -e "$file" ] || continue
            grep -qxF "$(basename "$file")" <<< "$keep" || rm -f "$file"
          done
          ls -l dist/*.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # build-: publish uploads it with the packages.
          name: build-sources
          path: dist/*-third-party-sources.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [build, macos, sources]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To upload to the release and publish it.
      contents: write
      # For the build provenance.
      id-token: write
      attestations: write
    steps:
      # For scripts/update-manifest.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          # Not dist/: git tracks dist/catalog/, which isn't part of a release.
          path: release
          merge-multiple: true
      - name: Checksums and latest.json
        working-directory: release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for file in *.tar.gz *.zip *.tar *.AppImage *.deb *.rpm *.pkg.tar.zst *.exe *.dmg; do
            [ -e "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done
          # What the launcher reads to update itself.
          ../scripts/update-manifest.sh . "$TAG" "$GH_REPO" > latest.json
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/*.tar
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/*.exe
            release/*.dmg
      # The launcher's updater reads the latest release, so it never sees one without its files.
      - name: Attach the files and publish as the latest
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find . -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release edit "$TAG" --draft=false --latest

  os:
    name: Start Nexus OS
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # To write os/nexus.txt on main.
      contents: write
      # To start os.yml and release.yml.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OS_RELEASE: ${{ inputs.os-release }}
    steps:
      # The OS bundles Nexus, so a new Nexus is a change to the OS: os/nexus.txt names the
      # Nexus release, and its commit makes Release Please open the OS release pull request,
      # whose stick then bundles this Nexus. A new major or minor Nexus is a feature of the OS,
      # a patch a fix. An OS release made with this one already bundles it: the commit is a
      # chore then, which releases nothing.
      - name: Name this Nexus in os/nexus.txt
        run: |
          file=$(gh api "repos/$GH_REPO/contents/os/nexus.txt?ref=main")
          named=$(jq -r .content <<<"$file" | base64 -d | tr -d '[:space:]')
          if [ "$named" = "$TAG" ]; then
            echo "os/nexus.txt already names $TAG"
            exit 0
          fi
          if [ -n "$OS_RELEASE" ]; then
            type=chore
          elif [ "${named%.*}" != "${TAG%.*}" ]; then
            type=feat
          else
            type=fix
          fi
          gh api -X PUT "repos/$GH_REPO/contents/os/nexus.txt" -f branch=main \
            -f sha="$(jq -r .sha <<<"$file")" -f content="$(printf '%s\n' "$TAG" | base64)" \
            -f message="$type(os): bundle Nexus $TAG" >/dev/null
          # GitHub doesn't start workflows on a push made with a workflow's own token.
          if [ -z "$OS_RELEASE" ]; then
            gh workflow run release.yml --ref main
          fi
      # The OS release made with this one, on its tag; or new images with this Nexus for the
      # PCs already installed.
      - name: Start os.yml
        run: |
          if [ -n "$OS_RELEASE" ]; then
            gh workflow run os.yml --ref "$OS_RELEASE"
          else
            gh workflow run os.yml --ref main -f test=false -f iso=false
          fi
