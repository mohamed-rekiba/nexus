name: Package

# Builds Nexus's packages on each system:
#   Linux    the tar.gz, the AppImage, and the deb, rpm and Arch packages
#   macOS    one universal Nexus.app (Apple Silicon and Intel), as a .zip and a .dmg, signed with
#            the Developer ID and notarized when the secrets are set (docs/signing.md)
#   Windows  the zip and the installer, signed when the certificate is set
#
# With a tag (release.yml calls it so, or run it by hand for a release whose build failed) it
# attaches the files to the tag's draft release, with a SHA-256 file and signed build
# provenance for each and latest.json for the launcher's updater, then publishes the release as
# the latest. Without a tag it only builds, and the files stay as this run's artifacts: run it
# so to try a packaging change.
#
# It doesn't run the tests: CI did on the commit before it reached main.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: A release's tag to build and publish (for example v0.2.0); empty only builds
        type: string
        default: ""

permissions: {}

# Two runs for the same release never upload to it at once.
concurrency:
  group: package-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Homebrew updates itself before each install unless told not to: minutes per macOS job.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  TAG: ${{ inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG, but Cargo.toml says version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # One system failing doesn't cancel the others: "Re-run failed jobs" then builds only it.
      fail-fast: false
      matrix:
        include:
          # 22.04: the Linux build runs on systems with glibc as old as its own.
          - { name: linux, runner: ubuntu-22.04 }
          # Each Mac processor on a runner of its own kind; the macos job joins them.
          - { name: macos-arm64, runner: macos-14 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows, runner: windows-2022 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: ./.github/actions/setup
        with:
          cache-key: package-${{ matrix.name }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # libmpv for the trailer player and libarchive for RAR and other archives, which the
      # package ships with their licences.
      - uses: ./.github/actions/libmpv
      - uses: ./.github/actions/libarchive
      # The crates' licences for the package (about.toml), prebuilt.
      - if: matrix.name != 'macos-x86_64'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2
      # cargo-about has no Intel Mac build: compile it. Its program needs the `cli` feature,
      # which install-action's fallback leaves out.
      - name: cargo-about (Intel Mac)
        if: matrix.name == 'macos-x86_64'
        run: cargo install cargo-about@0.9.2 --locked --features cli
      # Builds, runs `nexus --help` from the package, and packs it on Linux and macOS.
      - run: scripts/package.sh

      - name: AppImage, deb, rpm and Arch packages (Linux)
        if: runner.os == 'Linux'
        run: |
          scripts/appimage.sh
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Nexus-x86_64.AppImage --version
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-packages
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Sign nexus.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.ps1 dist\nexus-windows-*\*.exe dist\nexus-windows-*\*.dll
      - name: Zip and installer (Windows)
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && 7z a -tzip nexus-windows-x86_64.zip nexus-windows-x86_64 > /dev/null)
          scripts/windows-installer.sh "$VERSION"
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.ps1 dist\nexus-windows-x86_64-setup.exe
      # The installer installs silently, Nexus starts from where it put it, and the uninstaller
      # takes it all away again.
      - name: Try the installer (Windows)
        if: runner.os == 'Windows'
        run: |
          dist/nexus-windows-x86_64-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART //TASKS=""
          # The installer's [Run] entry starts Nexus after a silent install: end it.
          sleep 5; taskkill //IM nexus.exe //F 2> /dev/null || true
          app="$LOCALAPPDATA/Programs/Nexus"
          test -f "$app/installed-by-setup"
          "$app/nexus.exe" --help > /dev/null
          "$app/unins000.exe" //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          for _ in $(seq 30); do [ ! -e "$app/nexus.exe" ] && break; sleep 1; done
          test ! -e "$app/nexus.exe"

      # The source of the GPL code the package ships (mpv, FFmpeg), to publish beside it. The
      # macOS sources go with the universal app.
      - name: Third-party sources
        if: runner.os != 'macOS'
        run: |
          for dir in dist/nexus-*/; do
            scripts/fetch-sources.sh "${dir%/}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tar
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS universal app
    needs: build
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-macos-*
          path: built
          merge-multiple: true
      - name: Join the two apps
        run: |
          for arch in aarch64 x86_64; do
            ditto -x -k "built/nexus-macos-$arch.zip" "built/$arch"
          done
          mkdir -p dist/nexus-macos-universal
          packaging/macos/universal.sh built/aarch64/nexus-macos-aarch64/Nexus.app \
            built/x86_64/nexus-macos-x86_64/Nexus.app dist/nexus-macos-universal/Nexus.app
          cp built/aarch64/nexus-macos-aarch64/{README.md,LICENSE} dist/nexus-macos-universal/
          dist/nexus-macos-universal/Nexus.app/Contents/MacOS/nexus --help > /dev/null
      - name: Third-party sources
        run: scripts/fetch-sources.sh dist/nexus-macos-universal
      # A Developer ID signature and Apple's notarization, when the secrets are set:
      # MACOS_CERT_P12 (the certificate, base64), MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID
      # and APPLE_APP_PASSWORD (an app-specific password). Without them the app stays signed
      # ad hoc, and Gatekeeper asks before the first start.
      - name: Sign and notarize the app
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          name=nexus-macos-universal
          app="dist/$name/Nexus.app"
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::no MACOS_CERT_P12: the macOS app is signed ad hoc only"
          else
            keychain="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings "$keychain"
            security unlock-keychain -p "" "$keychain"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
            security list-keychains -d user -s "$keychain"
            # Libraries first, then the bundle: the hardened runtime and a timestamp, as
            # notarization asks.
            find "$app/Contents/Frameworks" -name '*.dylib' -exec codesign --force --timestamp --options runtime --sign "Developer ID Application" {} +
            codesign --force --timestamp --options runtime --sign "Developer ID Application" "$app"
            (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
            xcrun notarytool submit "dist/$name.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$app"
          fi
          (cd dist && rm -f "$name.zip" && ditto -c -k --keepParent "$name" "$name.zip")
      - name: Disk image
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg=dist/nexus-macos-universal.dmg
          packaging/macos/make-dmg.sh dist/nexus-macos-universal/Nexus.app "$dmg"
          if [ -n "$MACOS_CERT_P12" ]; then
            codesign --force --timestamp --sign "Developer ID Application" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
          hdiutil verify "$dmg"
          mounted=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/Volumes/ {print $NF}')
          test -x "$mounted/Nexus.app/Contents/MacOS/nexus"
          test -L "$mounted/Applications"
          hdiutil detach "$mounted"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos-universal
          path: |
            dist/nexus-macos-universal.zip
            dist/nexus-macos-universal.dmg
            dist/*.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [build, macos]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To upload to the release and publish it.
      contents: write
      # For the build provenance.
      id-token: write
      attestations: write
    steps:
      # For scripts/update-manifest.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      # Each Mac processor's own zip was only the universal app's input.
      - run: rm -f dist/nexus-macos-aarch64.zip dist/nexus-macos-x86_64.zip
      - name: Checksums and latest.json
        working-directory: dist
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for file in *.tar.gz *.zip *.tar *.AppImage *.deb *.rpm *.pkg.tar.zst *.exe *.dmg; do
            [ -e "$file" ] || continue
            sha256sum "$file" > "$file.sha256"
          done
          # What the launcher reads to update itself.
          ../scripts/update-manifest.sh . "$TAG" "$GH_REPO" > latest.json
          ls -l
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.tar
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.exe
            dist/*.dmg
      # The launcher's updater reads the latest release, so it never sees one without its files.
      - name: Attach the files and publish as the latest
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" ./* --clobber
          gh release edit "$TAG" --draft=false --latest
