name: Weekly

# Slow checks that don't belong on every push, every Monday and by hand:
# - the tests on Windows (CI tests on Linux only);
# - the real KytyPS5 and shadPS4 releases download and install, so a changed upstream build is
#   found before a player finds it (it needs the network and hundreds of megabytes);
# - the desktop adapter against real windows (Xvfb and openbox);
# - the trailer player plays a real video through libmpv;
# - cargo-deny with the newest advisories.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Once a week a cold build is cheaper than keeping caches for these jobs.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # CI tests on Linux only; this catches what breaks on Windows (paths, mostly) once a week.
  windows:
    name: Test (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --locked --no-fail-fast

  real-releases:
    name: Real emulator releases
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Calls the GitHub API without a token: its limit for anonymous calls can fail this on a
      # busy runner. Run it again then.
      - run: cargo test --locked -p nexus-app real -- --nocapture
        env:
          NEXUS_REAL_RELEASES: "1"

  desktop:
    name: Desktop adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          linux-packages: xvfb openbox xdotool x11-utils libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      # Waits for openbox to own the screen before the test starts.
      - env:
          NEXUS_DESKTOP_TESTS: "1"
          NEXUS_DESKTOP_REQUIRE: "1"
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          bash -c 'openbox & for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK | grep -q window && break; sleep 0.2; done;
          cargo test --locked -p nexus-app --test desktop'

  trailer:
    name: Trailer player
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          linux-packages: ffmpeg
      - uses: ./.github/actions/libmpv
      - run: cargo test --locked -p nexus-app libmpv_plays
        env:
          NEXUS_TRAILER_TESTS: "1"

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
