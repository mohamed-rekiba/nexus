name: release

# Release Please keeps a release pull request open on main for Nexus. It collects the
# Conventional Commit messages since the last release (feat: raises the minor version, fix: the
# patch; before 1.0 a breaking change raises the minor), bumps the version in Cargo.toml and
# Cargo.lock, and writes CHANGELOG.md. Merging that pull request makes a draft release and its
# tag; package.yml builds every system's files and attaches them, and only then is the release
# published, as the latest. The launcher's updater reads the latest release, so it never sees
# one without its files. The tag is made with the draft (force-tag-creation): GitHub tags a draft
# only when it is published, and without the tag Release Please can't find the release and opens
# the same release pull request again.
#
# Nexus OS (os/) is a second package with its own release pull request, version, changelog and
# tags (nexus-os-v<version>). Merging it builds the OS images and the USB stick (os.yml), attaches
# the stick to the draft and publishes it, never as the latest. A published Nexus release also
# rebuilds the OS images, with the new rpm.
#
# package.yml is called, not started by the tag: GitHub doesn't start workflows from events its
# own workflow token causes.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      # Nexus OS (the os/ package): Release Please prefixes a package's outputs with its path.
      os-created: ${{ steps.rp.outputs['os--release_created'] }}
      os-tag: ${{ steps.rp.outputs['os--tag_name'] }}
      os-sha: ${{ steps.rp.outputs['os--sha'] }}
      os-version: ${{ steps.rp.outputs['os--version'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with the default token don't start CI. To get checks on the
          # release pull request, add a personal access token (or a GitHub App's) as the
          # RELEASE_PLEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      ref: ${{ needs.release-please.outputs.sha }}
    secrets: inherit

  publish:
    needs: [release-please, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --draft=false --latest

  # A published Nexus release: the Nexus OS images are rebuilt with its rpm, so installed PCs get
  # it with their next system update. No new stick: installed PCs update themselves.
  os-images:
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/os.yml

  # A Nexus OS release (its own release pull request, tags nexus-os-v<version>): the images are
  # built, checked and tagged with the version, then the stick is built and attached to the draft.
  # The images bundle the latest published Nexus, so when both are released by one push, the OS
  # waits for Nexus's release to be published, and isn't built if that failed.
  os-release:
    needs: [release-please, publish]
    if: >-
      always() && needs.release-please.outputs.os-created == 'true'
      && needs.publish.result != 'failure' && needs.publish.result != 'cancelled'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/os.yml
    with:
      ref: ${{ needs.release-please.outputs.os-sha }}
      version: ${{ needs.release-please.outputs.os-version }}
      iso: true

  # The ISO (or its parts) and the checksums go on the draft, which is then published, but not as
  # the latest release: Nexus's updater reads the latest release, which stays a Nexus one.
  os-publish:
    needs: [release-please, os-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-os-iso
          path: iso
      - name: Attach the stick and publish, not as the latest
        working-directory: iso
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.os-tag }}
        run: |
          ls -l
          # The whole ISO's checksum stays when it was split into parts; each part has its own.
          for sum in ./*.sha256; do [ ! -e "${sum%.sha256}" ] || sha256sum -c "$sum"; done
          gh release upload "$TAG" ./* --clobber
          gh release edit "$TAG" --draft=false --latest=false
