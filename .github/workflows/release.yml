name: Release

# Release Please keeps a release pull request open on main for each package: Nexus (the
# workspace) and Nexus OS (os/, tags nexus-os-v<version>). It reads the Conventional Commit
# messages since the last release, bumps the version and writes the changelog. Merging the pull
# request makes a draft release and its tag (force-tag-creation: without the tag Release Please
# can't find a draft and opens the same pull request again).
#
# The same run then builds what was released:
# - Nexus: package.yml builds, attaches and publishes the release as the latest, then os.yml
#   rebuilds the images with it.
# - Nexus OS: os.yml builds the images and the stick from the tag and publishes the release,
#   never as the latest. When one merge released both, it runs after Nexus's release is out,
#   since the images bundle it.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Two pushes close together never edit the release pull requests at once.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      nexus: ${{ steps.rp.outputs.release_created == 'true' && steps.rp.outputs.tag_name || '' }}
      # Release Please prefixes a package's outputs with its path.
      os: ${{ steps.rp.outputs['os--release_created'] == 'true' && steps.rp.outputs['os--tag_name'] || '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with the default token don't start CI. To get checks on the
          # release pull request, add a personal access token (or a GitHub App's) as the
          # RELEASE_PLEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  package:
    name: Nexus
    needs: release-please
    if: needs.release-please.outputs.nexus != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release-please.outputs.nexus }}
    secrets: inherit

  os:
    name: Nexus OS
    needs: [release-please, package]
    # After a Nexus release (new images), or for an OS release; never after a failed Nexus one.
    if: >-
      !cancelled() && needs.package.result != 'failure'
      && (needs.release-please.outputs.nexus != '' || needs.release-please.outputs.os != '')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/os.yml
    with:
      release: ${{ needs.release-please.outputs.os }}
